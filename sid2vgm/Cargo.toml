[package]
name = "sid2vgm"
version = "0.1.0"
edition = "2024"
authors = ["Gautier Portet <kassoulet@gmail.com>"]
description = "Convert Commodore 64 SID music files to VGM format"
license = "MIT"
repository = "https://github.com/kassoulet/sid2vgm"
readme = "../README.md"

[dependencies]
sidplayfp-sys = "0.1"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
anyhow = "1.0"
byteorder = "1.5"
md5 = "0.7"

[dev-dependencies]
sidlite-sys = "0.1"
hound = "3.5"
